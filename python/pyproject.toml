[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llikert"
version = "0.1.0.dev0"
description = "Candidate-token probability scoring of text datasets with llama.cpp"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "The LLikert authors" }]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/rimonim/llikert"
Issues = "https://github.com/rimonim/llikert/issues"

[project.optional-dependencies]
# llama-cpp-python is deliberately absent: the service needs the pinned source build
# against llama.cpp v0.4.1 (see docs/decisions/0002-m0-findings.md). PyPI wheels of the
# same version vendor an older llama.cpp and are rejected at startup.
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "numpy>=1.26",
  "jinja2>=3.1",
]
dev = ["pytest>=8"]

[project.scripts]
llikert = "llikert.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llikert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: requires a real GGUF model (LLIKERT_TEST_MODEL) and the pinned llama.cpp build",
]
addopts = "-m 'not model'"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
